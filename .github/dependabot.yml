# Aggiornamenti automatici delle dipendenze, raggruppati in una PR a settimana.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-e-patch:
        update-types: [minor, patch]
